<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Perfil do Jogador</title>

<style>

body {
  background: #0a0f1c;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.card {
  width: 300px;
  background: #111827;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-body {
  padding: 15px;
}

.info {
  margin: 8px 0;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.reveal {
  background: #22c55e;
}

.add {
  background: #3b82f6;
}

button:hover {
  opacity: 0.8;
}

</style>
</head>

<body>

<div id="container">

  <div class="card">

    <!-- IMAGEM INICIAL -->
    <img id="foto" src="img_.svg">

    <div class="card-body">

      <div class="info">Nome: <span id="nome">???</span></div>
      <div class="info">Nascimento: <span id="nascimento">??/??/????</span></div>
      <div class="info">Altura: <span id="altura">?.??</span></div>
      <div class="info">Posição: <span id="posicao">???</span></div>

      <button class="reveal" onclick="revelar()">Revelar</button>
      <button class="add" onclick="add()">Adicionar Jogador</button>

    </div>
  </div>

</div>

<script>

function revelar(){

  // ⚠️ nome EXATO do seu arquivo
  document.getElementById("foto").src = "_vinicius_junior.png";

  document.getElementById("nome").textContent = "Vinícius Júnior";
  document.getElementById("nascimento").textContent = "12/07/2000";
  document.getElementById("altura").textContent = "1,76m";
  document.getElementById("posicao").textContent = "Atacante";

}

function add(){

  const container = document.getElementById("container");

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="Lucas_Paqueta.webp">

    <div class="card-body">
      <div class="info">Nome: Lucas Paquetá</div>
      <div class="info">Nascimento: 27/08/1997</div>
      <div class="info">Altura: 1,80m</div>
      <div class="info">Posição: Meio-campo</div>
    </div>
  `;

  container.appendChild(card);
}

</script>

</body>
</html>
