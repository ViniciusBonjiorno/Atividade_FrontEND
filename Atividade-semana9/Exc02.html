<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Temperatura</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #e8643a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: white;
      padding: 48px 40px;
      border-radius: 16px;
      text-align: center;
      width: 360px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }

    .campo {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      text-align: center;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #e8643a;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 20px;
      color: #ccc;
      font-size: 22px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌡️ Conversor de Temperatura</h1>
    <p>Digite em qualquer campo e veja a conversão em tempo real</p>

    <div class="campo">
      <label>Celsius (°C)</label>
      <input type="number" id="celsius" placeholder="0.00" step="0.1">
    </div>

    <div class="divider">⇅</div>

    <div class="campo">
      <label>Fahrenheit (°F)</label>
      <input type="number" id="fahrenheit" placeholder="32.00" step="0.1">
    </div>
  </div>

  <script>
    const celsius = document.getElementById('celsius');
    const fahrenheit = document.getElementById('fahrenheit');

    celsius.addEventListener('input', function() {
      if (this.value === '') {
        fahrenheit.value = '';
        return;
      }
      const f = (parseFloat(this.value) * 9 / 5) + 32;
      fahrenheit.value = f.toFixed(2);
    });

    fahrenheit.addEventListener('input', function() {
      if (this.value === '') {
        celsius.value = '';
        return;
      }
      const c = (parseFloat(this.value) - 32) * 5 / 9;
      celsius.value = c.toFixed(2);
    });
  </script>

</body>
</html>
