<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Bank — Convidados VIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #2c2c54;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #2c2c54;
    }

    .btn-add {
      padding: 12px 20px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      background-color: #2c2c54;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .btn-add:hover {
      background-color: #1e1e3a;
    }

    .lista-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .lista-header span {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #contador {
      font-size: 12px;
      font-weight: 600;
      background-color: #ececf5;
      color: #2c2c54;
      padding: 3px 10px;
      border-radius: 100px;
    }

    #lista {
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .nome {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      flex: 1;
      transition: all 0.2s;
    }

    .nome.presente {
      text-decoration: line-through;
      color: #aaa;
    }

    .acoes {
      display: flex;
      gap: 6px;
    }

    .acoes button {
      padding: 6px 12px;
      font-size: 12px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .acoes button:hover {
      opacity: 0.8;
    }

    .btn-concluir {
      background-color: #d4edda;
      color: #1e7e3e;
    }

    .btn-editar {
      background-color: #fff3cd;
      color: #856404;
    }

    .btn-excluir {
      background-color: #f8d7da;
      color: #a71d2a;
    }

    .vazio {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>👥 Convidados VIP</h1>
    <p class="subtitle">Infinity Bank — Gestão de lista para o evento de inauguração</p>

    <div class="input-row">
      <input type="text" id="nome-input" placeholder="Nome do convidado">
      <button class="btn-add" onclick="adicionar()">+ Adicionar</button>
    </div>

    <div class="lista-header">
      <span>Lista de convidados</span>
      <span id="contador">0 convidados</span>
    </div>

    <ul id="lista">
      <li class="vazio" id="vazio">Nenhum convidado adicionado ainda.</li>
    </ul>
  </div>

  <script>
    const input = document.getElementById('nome-input');
    const lista = document.getElementById('lista');
    const contador = document.getElementById('contador');
    const vazio = document.getElementById('vazio');
    let total = 0;

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') adicionar();
    });

    function atualizarContador() {
      contador.textContent = `${total} convidado${total !== 1 ? 's' : ''}`;
      vazio.style.display = total === 0 ? 'block' : 'none';
    }

    function adicionar() {
      const nome = input.value.trim();
      if (!nome) return;

      const li = document.createElement('li');
      li.className = 'item';
      li.innerHTML = `
        <span class="nome">${nome}</span>
        <div class="acoes">
          <button class="btn-concluir" onclick="concluir(this)">✔ Concluir</button>
          <button class="btn-editar" onclick="editar(this)">✏ Editar</button>
          <button class="btn-excluir" onclick="excluir(this)">✕ Excluir</button>
        </div>
      `;

      lista.appendChild(li);
      input.value = '';
      total++;
      atualizarContador();
    }

    function concluir(btn) {
      const nome = btn.closest('.item').querySelector('.nome');
      nome.classList.toggle('presente');
      btn.textContent = nome.classList.contains('presente') ? '↩ Desfazer' : '✔ Concluir';
    }

    function editar(btn) {
      const nomeEl = btn.closest('.item').querySelector('.nome');
      const novoNome = prompt('Editar nome do convidado:', nomeEl.textContent);
      if (novoNome && novoNome.trim()) {
        nomeEl.textContent = novoNome.trim();
      }
    }

    function excluir(btn) {
      btn.closest('.item').remove();
      total--;
      atualizarContador();
    }

    atualizarContador();
  </script>

</body>
</html>
