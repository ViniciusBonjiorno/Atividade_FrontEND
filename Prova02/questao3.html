<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Grupos</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #020617;
  color: #e2e8f0;
  padding: 40px 20px;
}

/* HEADER */

.header {
  text-align: center;
  margin-bottom: 50px;
}

.header h1 {
  font-size: 2.5rem;
  background: linear-gradient(90deg, #22c55e, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  max-width: 1100px;
  margin: auto;
}

/* CARD */

.card {
  position: relative;
  padding: 1px;
  border-radius: 20px;
  background: linear-gradient(120deg, #22c55e, #38bdf8, #a78bfa);
}

.card-inner {
  background: rgba(2,6,23,0.9);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 25px;
  transition: 0.4s;
}

.card-inner.fade {
  opacity: 0;
  transform: translateY(10px);
}

.card-inner.show {
  opacity: 1;
  transform: translateY(0);
}

/* TITULO */

.card h2 {
  font-size: 1.4rem;
  margin-bottom: 15px;
}

/* LISTA */

.list {
  list-style: none;
  margin-bottom: 15px;
}

.list li {
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 6px;
  background: rgba(255,255,255,0.04);
  transition: 0.2s;
}

.list li:hover {
  background: rgba(56,189,248,0.2);
}

/* EXPAND */

.expand-btn {
  background: none;
  border: none;
  color: #38bdf8;
  cursor: pointer;
  font-size: 0.9rem;
  margin-top: 5px;
}

.extra {
  max-height: 0;
  overflow: hidden;
  transition: 0.3s;
  font-size: 0.85rem;
  color: #94a3b8;
}

.extra.open {
  max-height: 100px;
  margin-top: 10px;
}

/* NAV */

.nav {
  display: flex;
  justify-content: center;
  margin-top: 40px;
  gap: 15px;
}

.nav button {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.05);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.nav button.active {
  background: linear-gradient(90deg, #22c55e, #38bdf8);
  color: black;
}

.nav button:hover {
  transform: scale(1.05);
}

</style>
</head>

<body>

<div class="header">
  <h1>Grupos da Competição</h1>
</div>

<div class="grid">

  <div class="card">
    <div class="card-inner" id="card-1">
      <h2 id="titulo-1"></h2>
      <ul class="list" id="lista-1"></ul>
      <button class="expand-btn" onclick="toggleExtra(1)">Ver mais</button>
      <div class="extra" id="extra-1"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner" id="card-2">
      <h2 id="titulo-2"></h2>
      <ul class="list" id="lista-2"></ul>
      <button class="expand-btn" onclick="toggleExtra(2)">Ver mais</button>
      <div class="extra" id="extra-2"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner" id="card-3">
      <h2 id="titulo-3"></h2>
      <ul class="list" id="lista-3"></ul>
      <button class="expand-btn" onclick="toggleExtra(3)">Ver mais</button>
      <div class="extra" id="extra-3"></div>
    </div>
  </div>

</div>

<div class="nav">
  <button onclick="trocar(0)" id="btn-0" class="active">A-C</button>
  <button onclick="trocar(1)" id="btn-1">D-F</button>
</div>

<script>

var conjuntos = [
  [
    {titulo:"Grupo A", selecoes:["México","África do Sul","Coreia do Sul","República Tcheca"], fato:"Jogo de abertura será México x África do Sul."},
    {titulo:"Grupo B", selecoes:["Canadá","Suíça","Catar","Bósnia"], fato:"Canadá joga em casa."},
    {titulo:"Grupo C", selecoes:["Brasil","Marrocos","Haiti","Escócia"], fato:"Brasil nunca perdeu para a Escócia."}
  ],
  [
    {titulo:"Grupo D", selecoes:["EUA","Paraguai","Austrália","Turquia"], fato:"EUA jogam em casa."},
    {titulo:"Grupo E", selecoes:["Alemanha","Equador","Costa do Marfim","Curaçao"], fato:"Alemanha costuma dominar grupos."},
    {titulo:"Grupo F", selecoes:["Holanda","Japão","Tunísia","Suécia"], fato:"Holanda e Japão já se enfrentaram."}
  ]
];

function preencher(i){

  for(let c=1;c<=3;c++){
    let card = document.getElementById("card-"+c);
    card.classList.add("fade");

    setTimeout(()=>{
      let g = conjuntos[i][c-1];

      document.getElementById("titulo-"+c).textContent = g.titulo;

      let lista = document.getElementById("lista-"+c);
      lista.innerHTML = "";
      g.selecoes.forEach(s=>{
        let li=document.createElement("li");
        li.textContent=s;
        lista.appendChild(li);
      });

      document.getElementById("extra-"+c).textContent = g.fato;
      document.getElementById("extra-"+c).classList.remove("open");

      card.classList.remove("fade");
      card.classList.add("show");

    },200);
  }

  document.getElementById("btn-0").classList.toggle("active", i===0);
  document.getElementById("btn-1").classList.toggle("active", i===1);
}

function trocar(i){
  preencher(i);
}

function toggleExtra(i){
  document.getElementById("extra-"+i).classList.toggle("open");
}

preencher(0);

</script>

</body>
</html>
