<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #1a8a5a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      background-color: white;
      padding: 48px 40px;
      border-radius: 16px;
      text-align: center;
      width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    .campo {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 13px 16px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      background-color: white;
    }

    input:focus, select:focus {
      border-color: #1a8a5a;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid .campo {
      margin-bottom: 0;
    }

    button {
      margin-top: 8px;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      background-color: #1a8a5a;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #147a4e;
    }

    #resultado {
      margin-top: 20px;
      background-color: #f0faf5;
      border: 2px solid #b2dfc9;
      border-radius: 10px;
      padding: 20px;
      display: none;
      text-align: left;
    }

    #resultado h3 {
      font-size: 15px;
      font-weight: 700;
      color: #1a8a5a;
      margin-bottom: 14px;
      text-align: center;
    }

    .linha {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #555;
      padding: 6px 0;
      border-bottom: 1px solid #d4ede0;
    }

    .linha:last-child {
      border-bottom: none;
    }

    .linha span:last-child {
      font-weight: 600;
      color: #333;
    }

    .total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid #1a8a5a;
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 700;
      color: #1a8a5a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💳 Infinity Bank</h1>
    <p class="subtitle">Simule o custo da sua venda parcelada</p>

    <div class="campo">
      <label>Bandeira do Cartão</label>
      <select id="bandeira">
        <option value="visa">Visa (2%)</option>
        <option value="master">Mastercard (1.85%)</option>
        <option value="elo">Elo (3%)</option>
      </select>
    </div>

    <div class="grid">
      <div class="campo">
        <label>Valor da Venda (R$)</label>
        <input type="number" id="valor" placeholder="0,00" min="0" step="0.01">
      </div>
      <div class="campo">
        <label>Nº de Parcelas</label>
        <select id="parcelas">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
          <option value="4">4x</option>
          <option value="5">5x</option>
          <option value="6">6x</option>
          <option value="7">7x</option>
          <option value="8">8x</option>
          <option value="9">9x</option>
          <option value="10">10x</option>
          <option value="11">11x</option>
          <option value="12">12x</option>
        </select>
      </div>
    </div>

    <button id="calcular">Calcular</button>

    <div id="resultado">
      <h3>📊 Resumo da Transação</h3>
      <div class="linha"><span>Valor da venda</span><span id="r-venda"></span></div>
      <div class="linha"><span>Taxa da bandeira</span><span id="r-taxa"></span></div>
      <div class="linha"><span>Juros (0,35% ao mês)</span><span id="r-juros"></span></div>
      <div class="linha"><span>Taxa mensal (R$ 12,50/mês)</span><span id="r-mensal"></span></div>
      <div class="total">
        <span id="r-parcela-label"></span>
        <span id="r-parcela"></span>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('calcular').addEventListener('click', function() {
      const bandeira = document.getElementById('bandeira').value;
      const valor = Number(document.getElementById('valor').value);
      const parcelas = Number(document.getElementById('parcelas').value);

      if (!valor || valor <= 0) {
        alert('Por favor, informe um valor válido.');
        return;
      }

      // Taxa da bandeira via switch
      let taxaBandeiraPct;
      switch (bandeira) {
        case 'visa':   taxaBandeiraPct = 0.02;   break;
        case 'master': taxaBandeiraPct = 0.0185; break;
        case 'elo':    taxaBandeiraPct = 0.03;   break;
      }

      const taxaBandeira = valor * taxaBandeiraPct;

      // Juros simples: 0.35% ao mês
      const jurosTotais = valor * (0.0035 * parcelas);

      // Taxa mensal fixa de R$ 12,50
      const taxaMensal = 12.50 * parcelas;

      // Valor total e parcela
      const valorTotal = valor + taxaBandeira + jurosTotais + taxaMensal;
      const valorParcela = valorTotal / parcelas;

      const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      document.getElementById('r-venda').textContent = fmt(valor);
      document.getElementById('r-taxa').textContent = fmt(taxaBandeira);
      document.getElementById('r-juros').textContent = fmt(jurosTotais);
      document.getElementById('r-mensal').textContent = fmt(taxaMensal);
      document.getElementById('r-parcela-label').textContent = parcelas === 1 ? 'Valor total' : `Valor de cada parcela (${parcelas}x)`;
      document.getElementById('r-parcela').textContent = fmt(valorParcela);

      document.getElementById('resultado').style.display = 'block';
    });
  </script>

</body>
</html>
